name: security

# Builds the solution and runs dependency/secret hygiene checks on every change.
# Kept separate from any future release pipeline so a vulnerability always blocks the PR.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly run catches newly published CVEs for unchanged dependencies.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AppointMan.slnx

      - name: Build
        run: dotnet build AppointMan.slnx --configuration Release --no-restore

      - name: List vulnerable packages
        run: dotnet list package --vulnerable --include-transitive --format json

      - name: Verify formatting
        run: dotnet format AppointMan.slnx --verify-no-changes --no-restore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
