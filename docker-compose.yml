# Backoffice ortami: Backoffice API + React/nginx.
# TEK VERITABANI: mobil stack'in (/opt/AppointMan) SQL Server'i kullanilir.
# Burada ayri bir db servisi TANIMLANMAZ; api, 'appointman-network' uzerinden
# mobil stack'in 'db' DNS adina baglanir. Mobil stack once ayakta olmalidir.
# Gizli degerler .env dosyasindan okunur (bkz. .env.example).
services:
  api:
    build:
      context: .
      dockerfile: Rezervise.Api.BackOffice/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Mobil API ile AYNI veritabani (AppointManDb) — tek DB ilkesi.
      ConnectionStrings__DefaultConnection: "Server=db;Database=AppointManDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      JwtSettings__Secret: ${JWT_SECRET:?JWT_SECRET .env dosyasinda tanimli olmali}
      JwtSettings__Issuer: https://backoffice.rezervise.com
      JwtSettings__Audience: Rezervise-Backoffice
      JwtSettings__RequireHttpsMetadata: "false"
    restart: unless-stopped
    networks:
      - appointman-network

  frontend:
    build:
      context: .
      dockerfile: BackOffice.Dockerfile
    ports:
      # Sunucuda 80 Apache'ye aittir; frontoffice kismi loopback uzerinden
      # yayinlanir ve Apache vhost (backoffice.rezervise.com) buraya proxy yapar.
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - appointman-network

networks:
  appointman-network:
    # Mobil stack'in agina disaridan katilim; 'db' DNS adi o agda tanimlidir.
    external: true
    name: appointman_appointman-network
