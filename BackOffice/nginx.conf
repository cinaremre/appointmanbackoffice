# Backoffice statik sunumu + API ters vekili.
# /api/* ayni yolla api:8080'e tasinir (API rotalari /api/v1/admin ile baslar).
server {
    listen 80;
    server_name backoffice.rezervise.com _;

    # Turkce karakterlerin tarayicida dogru goruntulenmesi icin statik
    # dosyalarin Content-Type'ina charset eklenir. Nginx bunu eklemediginde
    # tarayici HTML/JS'i sistem kodlamasiyla yorumlayip bozuk gosterir.
    charset utf-8;
    source_charset utf-8;

    # React Router: statik olmayan yollar index'e dusmelidir.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API konteyneri ayakta değilse (502/503) istemciye uygulamanın
    # doğrudan gösterebileceği sabit JSON mesaj döner.
    error_page 502 503 = @service_unavailable;

    location @service_unavailable {
        default_type application/json;
        charset utf-8;
        return 503 '{"statusCode":503,"code":"service_unavailable","message":"İşlem Şu Anda Gerçekleştirilemiyor. Lütfen Birazdan Tekrar Deneyin."}';
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
